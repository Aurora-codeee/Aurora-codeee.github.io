<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">增长方案设计：业务约束到可评审方案</title><desc id="desc">AI 分步推演，脚本检查，人工确认关键取舍；盲测漏项回收到方法库。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 8 5 0 9" fill="none" stroke="#387ca4" stroke-width="1.6"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f1f5fb" stroke="#f1f5fb"/><text x="54" y="65" font-size="32" fill="#243f53" font-weight="600">把业务约束变成可执行的设计方法</text><text x="54" y="102" font-size="20" fill="#58778d" font-weight="400">方案设计 Skill · 方法与检查流程</text><rect x="54" y="174" width="328" height="236" rx="14" fill="#fff" stroke="#c9d9e5"/><text x="79" y="225" font-size="27" fill="#243f53" font-weight="600">业务输入</text><text x="79" y="281" font-size="23" fill="#243f53" font-weight="400">目标 / 活动背景</text><text x="79" y="323" font-size="22" fill="#58778d" font-weight="400">资源与不可变规则</text><rect x="436" y="174" width="328" height="236" rx="14" fill="#fff" stroke="#c9d9e5"/><text x="461" y="225" font-size="27" fill="#243f53" font-weight="600">AI 分步推演</text><text x="461" y="281" font-size="23" fill="#243f53" font-weight="400">玩法 / 成本 / 异常</text><text x="461" y="323" font-size="22" fill="#58778d" font-weight="400">保留依据与待决策项</text><rect x="818" y="174" width="328" height="236" rx="14" fill="#fff" stroke="#c9d9e5"/><text x="843" y="225" font-size="27" fill="#243f53" font-weight="600">评审交付</text><text x="843" y="281" font-size="23" fill="#243f53" font-weight="400">活动方案 / 评审依据</text><text x="843" y="323" font-size="22" fill="#58778d" font-weight="400">关键取舍由业务确认</text><path d="M385 280 L428 280" fill="none" stroke="#387ca4" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 280 L810 280" fill="none" stroke="#387ca4" stroke-width="2" marker-end="url(#arrow)"/><rect x="436" y="359" width="328" height="51" rx="10" fill="#dfeafb" stroke="#b8cfe3"/><text x="460" y="393" font-size="19" fill="#176a91" font-weight="400">脚本检查字段、阶段与版本</text><rect x="54" y="485" width="1092" height="147" rx="14" fill="#e5edf8" stroke="#bfd0e6"/><text x="81" y="526" font-size="24" fill="#176a91" font-weight="600">方法库迭代</text><text x="81" y="569" font-size="25" fill="#243f53" font-weight="500">盲测发现：资源触顶后怎么办？</text><text x="81" y="606" font-size="23" fill="#243f53" font-weight="400">补入运行规则：日奖池达到上限后，只发兜底券。</text><path d="M600 482 L600 432" stroke="#387ca4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="54" y="680" font-size="20" fill="#58778d" font-weight="400">设计示意 · 业务理解交给 AI，确定性检查交给脚本，关键决策由人确认。</text></g></svg>