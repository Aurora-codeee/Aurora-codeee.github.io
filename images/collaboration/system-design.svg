<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">多人协同工作台：个人过程、公共交接与状态同步</title><desc id="desc">成员与各自 Agent 在个人区处理输入和草稿；经本人确认后通过公共交换区投递与回执，发起人验收后归集正式知识；状态提交触发脚本同步工作台与看板。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 8 5 0 9" fill="none" stroke="#758595" stroke-width="1.6"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="880" rx="0" fill="#ffffff" stroke="#ffffff"/><text x="40" y="54" font-size="31" fill="#303a43" font-weight="600">个人过程独立，交接与结论共享</text><text x="40" y="87" font-size="19" fill="#66717a" font-weight="400">协同工作台 · 设计图</text><rect x="40" y="113" width="1120" height="103" rx="14" fill="#fff" stroke="#ccd1d6"/><text x="64" y="149" font-size="22" fill="#42586c" font-weight="600">公共依据</text><text x="64" y="186" font-size="23" fill="#303a43" font-weight="400">成员与协作规则</text><text x="351" y="149" font-size="22" fill="#42586c" font-weight="600">输入范围</text><text x="351" y="186" font-size="23" fill="#303a43" font-weight="400">按任务确认输入清单</text><text x="758" y="149" font-size="22" fill="#42586c" font-weight="600">检索与引用</text><text x="758" y="186" font-size="23" fill="#303a43" font-weight="400">背景 · 索引 · 现行知识</text><path d="M205 218 L205 259" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M995 218 L995 259" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="40" y="270" width="320" height="248" rx="14" fill="#fff" stroke="#ccd1d6"/><text x="64" y="311" font-size="25" fill="#303a43" font-weight="600">成员 A ＋ Agent</text><text x="64" y="346" font-size="19" fill="#66717a" font-weight="400">个人区</text><text x="64" y="382" font-size="21" fill="#303a43" font-weight="400">输入清单 / 任务草稿</text><text x="64" y="418" font-size="21" fill="#303a43" font-weight="400">状态 / 过程 / 历史版本</text><text x="64" y="465" font-size="21" fill="#303a43" font-weight="400">起草、整理待决问题</text><text x="64" y="493" font-size="18" fill="#42586c" font-weight="400">生效与对外交付由本人确认</text><rect x="840" y="270" width="320" height="248" rx="14" fill="#fff" stroke="#ccd1d6"/><text x="864" y="311" font-size="25" fill="#303a43" font-weight="600">成员 B ＋ Agent</text><text x="864" y="346" font-size="19" fill="#66717a" font-weight="400">个人区</text><text x="864" y="382" font-size="21" fill="#303a43" font-weight="400">输入清单 / 任务草稿</text><text x="864" y="418" font-size="21" fill="#303a43" font-weight="400">状态 / 过程 / 历史版本</text><text x="864" y="465" font-size="21" fill="#303a43" font-weight="400">接单、补充判断与回执</text><text x="864" y="493" font-size="18" fill="#42586c" font-weight="400">生效与对外交付由本人确认</text><rect x="435" y="293" width="330" height="202" rx="14" fill="#f2f4f6" stroke="#bec7cf"/><text x="462" y="336" font-size="26" fill="#303a43" font-weight="600">公共交换区</text><text x="462" y="377" font-size="21" fill="#303a43" font-weight="400">正件留在发起人出件箱</text><text x="462" y="414" font-size="21" fill="#303a43" font-weight="400">对方收件箱接收指向消息</text><text x="462" y="458" font-size="21" fill="#42586c" font-weight="400">协同单 · 回执 · 退回</text><path d="M362 362 L429 362" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)"/><path d="M769 362 L834 362" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)"/><text x="372" y="345" font-size="17" fill="#303a43" font-weight="400">投递</text><text x="776" y="345" font-size="17" fill="#303a43" font-weight="400">接单</text><path d="M834 444 L772 444" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)"/><path d="M429 444 L368 444" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)"/><text x="778" y="476" font-size="17" fill="#303a43" font-weight="400">回执</text><text x="372" y="476" font-size="17" fill="#303a43" font-weight="400">返回</text><rect x="40" y="559" width="1120" height="97" rx="14" fill="#fff" stroke="#ccd1d6"/><text x="66" y="596" font-size="23" fill="#303a43" font-weight="600">本人确认</text><text x="66" y="631" font-size="20" fill="#66717a" font-weight="400">草稿转为生效件</text><text x="348" y="596" font-size="23" fill="#303a43" font-weight="600">交回与验收</text><text x="348" y="631" font-size="20" fill="#66717a" font-weight="400">上游发起人确认</text><text x="703" y="596" font-size="23" fill="#303a43" font-weight="600">公共现行版本</text><text x="703" y="631" font-size="20" fill="#66717a" font-weight="400">保留来源单与历史版本</text><path d="M278 610 L326 610" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)"/><path d="M626 610 L680 610" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="704" font-size="22" fill="#42586c" font-weight="600">进度同步</text><text x="190" y="704" font-size="20" fill="#66717a" font-weight="400">状态由成员维护，视图由脚本生成</text><rect x="40" y="727" width="228" height="93" rx="14" fill="#f5f6f7" stroke="#cbd0d5"/><text x="56" y="766" font-size="21" fill="#303a43" font-weight="500">任务状态变更</text><text x="56" y="799" font-size="18" fill="#66717a" font-weight="400">提交个人仓</text><rect x="302" y="727" width="264" height="93" rx="14" fill="#f5f6f7" stroke="#cbd0d5"/><text x="318" y="766" font-size="21" fill="#303a43" font-weight="500">同步本人工作台</text><text x="318" y="799" font-size="18" fill="#66717a" font-weight="400">post-commit</text><rect x="600" y="727" width="212" height="93" rx="14" fill="#f5f6f7" stroke="#cbd0d5"/><text x="616" y="766" font-size="21" fill="#303a43" font-weight="500">公共仓收到推送</text><text x="616" y="799" font-size="18" fill="#66717a" font-weight="400">post-receive</text><rect x="846" y="727" width="314" height="93" rx="14" fill="#f5f6f7" stroke="#cbd0d5"/><text x="862" y="766" font-size="21" fill="#303a43" font-weight="500">看板 · 通知 · 索引</text><text x="862" y="799" font-size="18" fill="#66717a" font-weight="400">重建与规则校验</text><path d="M270 772 L296 772" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 772 L594 772" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)"/><path d="M814 772 L840 772" fill="none" stroke="#758595" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="854" font-size="18" fill="#66717a" font-weight="400">依据现有协作规则与脚本整理；区域边界表示协作约定，不表示账户权限控制。</text></g></svg>